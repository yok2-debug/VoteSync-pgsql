services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: votesync-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # DATABASE_URL dibentuk dari variabel postgres agar konsisten
      - DATABASE_URL=postgresql://${POSTGRES_USER:-votesync}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-votesync}
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-votesync}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-votesync}
    command: sh -c "npx prisma db push && node prisma/seed.js"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

  postgres:
    image: postgres:16-alpine
    container_name: votesync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-votesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-votesync}
    volumes:
      - votesync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-votesync}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  votesync_pgdata:
