services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: votesync-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-votesync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-votesync}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - VOTE_SECRET_SALT=${VOTE_SECRET_SALT}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-votesync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-votesync}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - VOTE_SECRET_SALT=${VOTE_SECRET_SALT}
    command: sh -c "npx prisma db push && node prisma/seed.js"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

  postgres:
    image: postgres:16-alpine
    container_name: votesync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-votesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-votesync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - votesync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-votesync}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  votesync_pgdata:
